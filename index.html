`.trim();

  // 把上面数据解析成 {asin, category, img}
  const RAW_PRODUCTS = RAW_DATA
    .split('\n')
    .map(line => line.trim())
    .filter(Boolean)
    .map((line, index) => {
      const parts = line.split(/\s+/);
      const asin = parts[0];
      const img  = parts[1];
      const category = CATEGORY_SEQUENCE[index % CATEGORY_SEQUENCE.length];
      return { asin, category, img };
    });

  // ========= 自动生成标题 / 摘要 / 评测 =========
  function autoTitle(index, category){
    return `Product #${index + 1} – ${category} Category Pick`;
  }

  function autoSummary(category){
    const base =
      `This pick is designed as a practical option in the ${category.toLowerCase()} space. ` +
      `The focus is on balanced everyday performance, ease of use and reasonable value. `;
    const extra =
      `It is the kind of product that most people can set up quickly and then mostly forget about, ` +
      `quietly supporting daily routines without demanding constant attention.`;
    return base + extra;
  }

  function makeReview(category){
    const sceneMap = {
      'Electronics':'day-to-day commuting, entertainment and light work use',
      'Home':'bedrooms, living rooms and small apartments where comfort matters',
      'Kitchen':'everyday meal prep, simple cooking and weekly batch tasks',
      'Outdoor':'short trips, casual camping and occasional travel',
      'Audio & Video':'music, TV and casual movie nights',
      'Car':'daily commuting, errands and longer weekend drives',
      'Office':'work-from-home desks and shared office spaces',
      'Sports':'everyday workouts, home training and basic recovery'
    };
    const scene = sceneMap[category] || 'everyday usage scenarios';

    const intro =
`[Positioning]
This product targets people who want a reliable, low-drama solution for ${scene}. It is not trying to be the flashiest or most expensive option; instead, it aims for a sensible middle ground where features, build quality and cost all feel balanced.`;

    const design =
`[Design & build]
The overall design is functional rather than flashy. Materials are in line with what you would expect at this price point, and the product feels ready for real homes and offices where things are used frequently and not always treated gently.`;

    const use =
`[Everyday use]
Setup is straightforward and day-to-day operation quickly becomes second nature. Most users can get the essentials running without having to dig through complex menus or manuals, which is exactly what many non-enthusiast buyers want.`;

    const prosCons =
`[Strengths & trade-offs]
The main strengths lie in its predictable behaviour and low learning curve. It will not satisfy someone hunting for niche features or enthusiast-level tinkering, but for general household or office use it hits a comfortable sweet spot.`;

    const advice =
`[Who is it for?]
If you value stability and simplicity over chasing extreme specifications, this is a sensible option to keep on your shortlist. If you later decide you need more advanced features, it also functions as a useful baseline to compare higher-end products against.`;

    return [intro, design, use, prosCons, advice].join('\n\n');
  }

  const PRODUCTS = RAW_PRODUCTS.map((p, index) => ({
    id: index + 1,
    asin: p.asin,
    category: p.category,
    img: p.img,
    title: autoTitle(index, p.category),
    summary: autoSummary(p.category),
    review: makeReview(p.category)
  }));

  // ========= 渲染逻辑 =========
  let currentList = PRODUCTS.slice();
  const gridEl = document.getElementById('productGrid');
  const countEl = document.getElementById('countInfo');
  const detailSection = document.getElementById('detailSection');
  const detailInner = document.getElementById('detailInner');

  function affiliateUrl(product){
    return `https://www.amazon.${AMAZON_DOMAIN}/dp/${product.asin}/?tag=${AFFILIATE_TAG}`;
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m=>(
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
    ));
  }

  function renderGrid(){
    const list = currentList;
    countEl.textContent = `Showing ${list.length} of ${PRODUCTS.length} products`;
    gridEl.innerHTML = list.map(p => `
      <article class="card">
        <div class="thumb">
          <img src="${p.img}" alt="${escapeHtml(p.title)}" loading="lazy">
        </div>
        <div class="cat">${escapeHtml(p.category)} · ASIN: ${p.asin}</div>
        <div class="title">${escapeHtml(p.title)}</div>
        <div class="snippet">${escapeHtml(p.summary)}</div>
        <div class="meta">
          <div class="price">Details &amp; live price on Amazon</div>
          <div class="btn-row">
            <button class="btn btn-ghost" onclick="openDetail('${p.asin}')">Read review</button>
            <a class="btn btn-primary" href="${affiliateUrl(p)}" target="_blank" rel="nofollow noopener">
              Go to Amazon (affiliate link)
            </a>
          </div>
        </div>
      </article>
    `).join('');
  }

  function openDetail(asin){
    const p = PRODUCTS.find(x=>x.asin === asin);
    if(!p) return;
    detailInner.innerHTML = `
      <div>
        <img src="${p.img}" alt="${escapeHtml(p.title)}">
      </div>
      <div>
        <div class="detail-title">${escapeHtml(p.title)}</div>
        <div class="detail-meta">Category: ${escapeHtml(p.category)} · ASIN: ${p.asin}</div>
        <div class="pill-row">
          <span class="pill">Editorial-style summary</span>
          <span class="pill">Direct /dp/ASIN link</span>
          <span class="pill">Best for everyday users</span>
        </div>
        <div class="detail-body">
          ${p.review.split('\n\n').map(par=>`<p>${escapeHtml(par)}</p>`).join('')}
        </div>
        <div class="detail-actions">
          <a class="btn btn-primary" href="${affiliateUrl(p)}" target="_blank" rel="nofollow noopener">
            View on Amazon (affiliate link)
          </a>
          <button class="btn btn-ghost" onclick="closeDetail()">Close</button>
        </div>
      </div>
    `;
    detailSection.style.display = 'block';
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function closeDetail(){
    detailSection.style.display = 'none';
  }
  window.openDetail = openDetail;
  window.closeDetail = closeDetail;

  // 分类筛选
  const chips = document.querySelectorAll('.chip');
  chips.forEach(ch => {
    ch.addEventListener('click', ()=>{
      chips.forEach(c=>c.classList.remove('active'));
      ch.classList.add('active');
      const cat = ch.getAttribute('data-cat');
      if(cat === 'All'){
        currentList = PRODUCTS.slice();
      }else{
        currentList = PRODUCTS.filter(p=>p.category === cat);
      }
      detailSection.style.display = 'none';
      renderGrid();
    });
  });

  // 搜索
  document.getElementById('searchBtn').addEventListener('click', ()=>{
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    doSearch(q);
  });
  document.getElementById('searchInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter'){
      const q = e.target.value.trim().toLowerCase();
      doSearch(q);
    }
  });

  function doSearch(q){
    if(!q){
      currentList = PRODUCTS.slice();
    }else{
      currentList = PRODUCTS.filter(p=>{
        const text = (p.title + ' ' + p.category + ' ' + p.summary + ' ' + p.asin).toLowerCase();
        return text.includes(q);
      });
    }
    detailSection.style.display = 'none';
    renderGrid();
  }

  // init
  renderGrid();
</script>
