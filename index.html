<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>US Deep Review • Smart Picks US</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="Independent editorial-style product notes with Amazon.com affiliate links. Not endorsed or pre-approved by Amazon."
  />
  <style>
    :root {
      --bg-page: #eef1f7;
      --bg-card: #ffffff;
      --bg-card-soft: #f6f7fb;
      --bg-dark: #0f172a;
      --text-main: #111827;
      --text-soft: #6b7280;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --accent-strong: #1d4ed8;
      --border-subtle: #e5e7eb;
      --chip-bg: #e5e7eb;
      --chip-bg-active: #1d4ed8;
      --chip-text-active: #ffffff;
      --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.14);
      --radius-lg: 18px;
      --radius-xl: 22px;
      --transition-fast: 0.18s ease-out;
      --max-width: 1200px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top, #e0edff 0, #eef1f7 45%, #e5e7eb 100%);
      color: var(--text-main);
    }
    a { color: var(--accent-strong); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.3);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .header-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand-block { display: flex; flex-direction: column; gap: 2px; }
    .site-title {
      font-size: 1.05rem;
      font-weight: 750;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .site-subtitle {
      font-size: 0.78rem;
      color: var(--text-soft);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .site-subtitle span { display: inline-flex; align-items: center; gap: 4px; }
    .dot {
      width: 3px; height: 3px; border-radius: 999px; background: #9ca3af;
    }
    .top-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .nav-btn {
      border-radius: 999px;
      border: 1px solid transparent;
      padding: 6px 10px;
      font-size: 0.78rem;
      background: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-soft);
      transition: background var(--transition-fast),
        color var(--transition-fast), border-color var(--transition-fast),
        box-shadow var(--transition-fast), transform var(--transition-fast);
    }
    .nav-btn span.badge {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 2px 6px;
      border-radius: 999px;
      background: #0f172a;
      color: #f9fafb;
    }
    .nav-btn.primary {
      border-color: rgba(148, 163, 184, 0.7);
      background: rgba(15, 23, 42, 0.92);
      color: #e5e7eb;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.45);
    }
    .nav-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(148, 163, 184, 0.5);
      border-color: rgba(148, 163, 184, 0.9);
      background: #ffffff;
      color: #0f172a;
    }
    .nav-btn.primary:hover {
      background: #020617;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.5);
      color: #e5e7eb;
    }
    .badge-market span.flag {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: linear-gradient(90deg,#3c3b6e 0 33%, #ffffff 33% 66%, #b22234 66% 100%);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.6);
    }
    .key-points {
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.76rem;
      color: #6b7280;
    }
    .key-points span {
      background: #e5e7eb;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .card-soft ul {
      padding-left: 16px;
      margin: 4px 0 0;
      font-size: 0.8rem;
    }
    .card-soft li + li { margin-top: 4px; }
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border-radius: 999px;
      border: 1px solid transparent;
      padding: 5px 12px;
      font-size: 0.78rem;
      background: var(--chip-bg);
      color: #374151;
      cursor: pointer;
      transition: background var(--transition-fast),
        color var(--transition-fast), transform var(--transition-fast),
        box-shadow var(--transition-fast), border-color var(--transition-fast);
    }
    .chip:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 10px rgba(148, 163, 184, 0.55);
      background: #e0e7ff;
    }
    .chip.active {
      background: var(--chip-bg-active);
      color: var(--chip-text-active);
      border-color: rgba(15, 23, 42, 0.4);
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.5);
    }
    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .search-input {
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      padding: 7px 12px;
      font-size: 0.8rem;
      min-width: 220px;
      max-width: 280px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 12px rgba(148, 163, 184, 0.3);
    }
    .btn-search {
      border-radius: 999px;
      border: none;
      background: var(--accent-strong);
      color: #f9fafb;
      padding: 7px 16px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 18px rgba(37, 99, 235, 0.6);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast),
        background var(--transition-fast);
    }
    .btn-search:hover {
      transform: translateY(-1px);
      background: #1d4ed8;
      box-shadow: 0 12px 22px rgba(37, 99, 235, 0.7);
    }
    .product-count { font-size: 0.76rem; color: #6b7280; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      align-items: stretch;
      margin-top: 8px;
    }
    .product-card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: var(--radius-lg);
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.14);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(148, 163, 184, 0.24);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast),
        border-color var(--transition-fast);
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.18);
      border-color: rgba(37, 99, 235, 0.5);
    }
    .product-card_media {
      position: relative;
      aspect-ratio: 4 / 3;
      background: radial-gradient(circle at top, #e5edff 0, #c7d2fe 45%, #94a3b8 100%);
      overflow: hidden;
    }
    .product-card_media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      mix-blend-mode: multiply;
    }
    .product-card_body {
      padding: 10px 12px 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .product-card_meta {
      font-size: 0.76rem;
      color: #6b7280;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    .meta-cat {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: #4b5563;
    }
    .meta-asin {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
    }
    .product-card_title { font-size: 0.95rem; margin: 0; }
    .product-card_hook {
      font-size: 0.8rem;
      color: #4b5563;
      margin: 0;
    }
    .product-card_desc {
      font-size: 0.78rem;
      color: #6b7280;
      margin: 0;
    }
    .product-card_footer {
      padding: 6px 12px 11px;
      border-top: 1px dashed rgba(148, 163, 184, 0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .product-card_price { font-size: 0.8rem; color: #4b5563; }
    .product-card_actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .btn {
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.78rem;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-card-soft);
      color: #111827;
      transition: background var(--transition-fast),
        color var(--transition-fast), border-color var(--transition-fast),
        box-shadow var(--transition-fast), transform var(--transition-fast);
      text-decoration: none;
    }
    .btn:hover {
      background: #e5e7eb;
      transform: translateY(-1px);
      box-shadow: 0 8px 12px rgba(148, 163, 184, 0.5);
    }
    .btn-primary {
      background: var(--accent-strong);
      color: #f9fafb;
      box-shadow: 0 10px 18px rgba(37, 99, 235, 0.65);
    }
    .btn-primary:hover { background: #1d4ed8; }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .info-card h3 { margin: 0 0 6px; font-size: 0.95rem; }
    .info-card p,
    .info-card li {
      font-size: 0.8rem;
      color: #4b5563;
    }
    .info-card ul { padding-left: 18px; margin: 4px 0 0; }
    .info-card li + li { margin-top: 4px; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.68);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal-backdrop.visible { display: flex; }
    .modal {
      background: #020617;
      color: #e5e7eb;
      max-width: 520px;
      width: calc(100% - 32px);
      border-radius: 22px;
      padding: 18px 18px 14px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(148, 163, 184, 0.7);
      position: relative;
    }
    .modal h2 { margin: 0 0 8px; font-size: 1.02rem; }
    .modal p {
      font-size: 0.82rem;
      color: #e5e7eb;
      line-height: 1.55;
      white-space: pre-line;
    }
    .modal-close {
      position: absolute;
      right: 12px;
      top: 10px;
      border-radius: 999px;
      border: none;
      width: 26px;
      height: 26px;
      background: rgba(15, 23, 42, 0.9);
      color: #9ca3af;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }
    .modal-footer .btn { font-size: 0.8rem; padding-inline: 12px; }

    @media (max-width: 860px) {
      .intro-layout { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 640px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }
      .top-nav { justify-content: flex-start; }
      .controls-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-row { justify-content: space-between; }
      .search-input { flex: 1; min-width: 0; }
    }
  </style>
</head>
<body>

<!-- 下面开始 JS -->
<script>
  const AMAZON_DOMAIN = "www.amazon.com";
  const AFFILIATE_TAG = "us1987-20";

  const baseCategories = ["Electronics", "Home", "Outdoor", "Car", "Office"];

  const rawProductsBase = [
    /* 你的 US 产品 ASIN 列表全部保留 – 已省略 */
  ];

  const rawProducts = rawProductsBase.map((p, index) => ({
    id: index + 1,
    asin: p.asin,
    image: p.image,
    category: baseCategories[index % baseCategories.length]
  }));

  const CATEGORY_MAP = {
    Electronics: "Electronics & Gadgets",
    Audio: "Electronics & Gadgets",
    Home: "Home & Kitchen",
    Kitchen: "Home & Kitchen",
    Outdoor: "Outdoor & Sports",
    Sports: "Outdoor & Sports",
    Car: "Car Accessories",
    Office: "Office & Daily Use",
    Other: "Office & Daily Use"
  };

  const products = rawProducts.map((p, index) => {
    const broadCat = CATEGORY_MAP[p.category] || "Office & Daily Use";
    const title = `Product #${index + 1} – ${broadCat} Pick`;
    const hook =
      `A practical and balanced ${broadCat.toLowerCase()} option for typical US use cases.`;
    const details =
      "This shortlist helps you quickly spot reasonable everyday picks before viewing full details, pricing and customer reviews directly on the retailer site.";
    const approxPriceLabel = "Check live price on the retailer site";
    const amazonUrl = `https://${AMAZON_DOMAIN}/dp/${p.asin}/?tag=${AFFILIATE_TAG}`;

    const reviewText =
      `${title}\n\n` +
      `Why this might be a suitable option:\n` +
      `• Everyday use: designed for normal household or personal use.\n` +
      `• Simple value: chosen for ease-of-use and balanced features.\n` +
      `• Fit: may be ideal for shoppers who want a practical daily pick.\n\n` +
      `Always open the retailer site for full specifications, live pricing and the latest customer reviews.`;

    return {
      ...p,
      broadCategory: broadCat,
      title,
      hook,
      details,
      approxPriceLabel,
      amazonUrl,
      reviewText
    };
  });

  const gridEl = document.getElementById("productGrid");
  const countEl = document.getElementById("productCount");
  const searchInput = document.getElementById("searchInput");
  const searchBtn = document.getElementById("searchBtn");
  const chipsContainer = document.getElementById("categoryChips");

  const modalBackdrop = document.getElementById("reviewModalBackdrop");
  const modalTitle = document.getElementById("reviewModalTitle");
  const modalBody = document.getElementById("reviewModalBody");
  const modalAmazonLink = document.getElementById("reviewModalAmazonLink");
  const modalClose = document.getElementById("reviewModalClose");
  const modalDismiss = document.getElementById("reviewModalDismiss");

  let activeCategory = "All picks";
  let searchTerm = "";

  function renderProducts(list) {
    gridEl.innerHTML = "";
    if (!list.length) {
      gridEl.innerHTML =
        '<div style="font-size:0.85rem;color:#6b7280;padding:10px 4px;">No matching products. Clear search or select "All picks".</div>';
    } else {
      list.forEach((p) => {
        const card = document.createElement("article");
        card.className = "product-card";
        card.innerHTML = `
          <div class="product-card_media">
            <img src="${p.image}" alt="${p.title}" loading="lazy" />
          </div>
          <div class="product-card_body">
            <div class="product-card_meta">
              <span class="meta-cat">${p.broadCategory}</span>
              <span class="meta-asin">ASIN: ${p.asin}</span>
            </div>
            <h3 class="product-card_title">${p.title}</h3>
            <p class="product-card_hook">${p.hook}</p>
            <p class="product-card_desc">${p.details}</p>
          </div>
          <div class="product-card_footer">
            <div class="product-card_price">${p.approxPriceLabel}</div>
            <div class="product-card_actions">
              <button class="btn" data-action="review" data-asin="${p.asin}">
                Read review
              </button>
              <a class="btn btn-primary" href="${p.amazonUrl}" target="_blank" rel="nofollow noopener sponsored">
                View details
              </a>
            </div>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }
    countEl.textContent = `Showing ${list.length} products`;
  }

  function getFilteredProducts() {
    const term = searchTerm.trim().toLowerCase();
    return products.filter((p) => {
      const matchesCategory =
        activeCategory === "All picks" || p.broadCategory === activeCategory;
      const haystack = `${p.title} ${p.asin} ${p.broadCategory}`.toLowerCase();
      const matchesSearch = !term || haystack.includes(term);
      return matchesCategory && matchesSearch;
    });
  }

  function applyFilters() { renderProducts(getFilteredProducts()); }

  function setActiveChip(categoryLabel) {
    activeCategory = categoryLabel;
    const chips = chipsContainer.querySelectorAll(".chip");
    chips.forEach((chip) => {
      chip.classList.toggle("active", chip.dataset.category === categoryLabel);
    });
    applyFilters();
  }

  chipsContainer.addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    setActiveChip(btn.dataset.category);
  });

  function handleSearch() {
    searchTerm = searchInput.value || "";
    applyFilters();
  }

  searchBtn.addEventListener("click", handleSearch);
  searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleSearch();
  });

  gridEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action='review']");
    if (!btn) return;
    const asin = btn.dataset.asin;
    const product = products.find((p) => p.asin === asin);
    if (product) openReviewModal(product);
  });

  function openReviewModal(product) {
    modalTitle.textContent = product.title.replace("Pick", "– Short review");
    modalBody.textContent = product.reviewText;
    modalAmazonLink.href = product.amazonUrl;
    modalBackdrop.classList.add("visible");
  }

  function closeReviewModal() {
    modalBackdrop.classList.remove("visible");
  }

  modalClose.addEventListener("click", closeReviewModal);
  modalDismiss.addEventListener("click", closeReviewModal);
  modalBackdrop.addEventListener("click", (e) => {
    if (e.target === modalBackdrop) closeReviewModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeReviewModal();
  });

  renderProducts(products);
</script>
</body>
</html>
