name: Sync US CSV

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 最小间隔通常为 5 分钟；15 分钟更稳
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-us-csv
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download CSV
        run: |
          set -euo pipefail
          URL="http://154.48.226.95:5001/admin/Product/export_csv"
          OUT="us.csv"

          # 拉取 CSV（带重试、超时、跟随跳转）
          curl -L --fail --retry 3 --retry-delay 2 \
            --connect-timeout 15 --max-time 60 \
            -H "Accept: text/csv,*/*;q=0.9" \
            -H "User-Agent: Mozilla/5.0 (GitHub Actions)" \
            "$URL" -o "$OUT"

      - name: Validate CSV not empty
        run: |
          set -euo pipefail
          test -s us.csv
          head -n 3 us.csv || true
          # 防止拿到 HTML/错误页（常见于 403/风控）
          if head -n 2 us.csv | grep -qiE "<!doctype html|<html"; then
            echo "ERROR: us.csv looks like HTML, not CSV."
            exit 1
          fi

      - name: Commit & Push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add us.csv
          if git diff --cached --quiet; then
            echo "No changes in us.csv, skip commit."
            exit 0
          fi

          git commit -m "Update us.csv"
          git push
